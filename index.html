<!doctype html><html lang="kn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KATHALOK AI</title><style>body{margin:0;font-family:system-ui;background:#0b1020;color:#fff}header{padding:20px;border-bottom:1px solid #26304a;font-weight:800;font-size:22px}main{max-width:1000px;margin:auto;padding:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#121a2d;border:1px solid #293451;border-radius:18px;padding:20px}textarea,select{width:100%;padding:13px;margin:8px 0;background:#0c1324;color:white;border:1px solid #35415e;border-radius:10px}button{padding:12px 18px;border:0;border-radius:10px;margin:8px 5px 0 0;font-weight:700}.scene{padding:12px;margin:8px 0;border:1px solid #303c59;border-radius:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header>KATHALOK AI <small> — AI Story Video Creator</small></header><main><h1>ಕಥೆಯಿಂದ ವೀಡಿಯೊವರೆಗೆ</h1><div class="grid"><section class="card"><h2>ಹೊಸ ಕಥೆ</h2><textarea id="idea" rows="8" placeholder="ನಿಮ್ಮ ಕಥೆಯ ಕಲ್ಪನೆಯನ್ನು ಬರೆಯಿರಿ..."></textarea><select id="duration"><option>1 ನಿಮಿಷ</option><option>3 ನಿಮಿಷ</option><option>5 ನಿಮಿಷ</option><option>10 ನಿಮಿಷ</option><option>20 ನಿಮಿಷ</option></select><select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option></select><br><button onclick="create()">ಕಥೆ ರಚಿಸಿ</button><button onclick="save()">ಉಳಿಸಿ</button><p id="status">ಕಥೆಯ ಕಲ್ಪನೆಯನ್ನು ನಮೂದಿಸಿ.</p></section><section class="card"><h2>ದೃಶ್ಯ ಯೋಜನೆ</h2><div id="scenes">ಇಲ್ಲಿ ದೃಶ್ಯಗಳು ಕಾಣಿಸುತ್ತವೆ.</div></section></div></main><script>let p={};function create(){let x=idea.value.trim();if(!x){status.textContent="ಕಥೆಯ ಕಲ್ಪನೆ ನಮೂದಿಸಿ.";return}p={idea:x,duration:duration.value,ratio:ratio.value};let a=["ಆರಂಭ — ಕುತೂಹಲ ಹುಟ್ಟಿಸುವ ಘಟನೆ","ಪರಿಚಯ — ಮುಖ್ಯ ಪಾತ್ರಗಳು","ಸಮಸ್ಯೆ — ದೊಡ್ಡ ಸವಾಲು","ತಿರುವು — ನಿರೀಕ್ಷಿಸದ ಘಟನೆ","ಅಂತ್ಯ — ಭಾವನಾತ್ಮಕ ಮುಕ್ತಾಯ"];scenes.innerHTML=a.map((s,i)=>`<div class="scene"><b>ದೃಶ್ಯ ${i+1}</b><br>${s}</div>`).join("");status.textContent="ದೃಶ್ಯ ಯೋಜನೆ ಸಿದ್ಧವಾಗಿದೆ."}function save(){if(!p.idea){status.textContent="ಮೊದಲು ಕಥೆ ರಚಿಸಿ.";return}localStorage.setItem("kathalok",JSON.stringify(p));status.textContent="ಯೋಜನೆ ಉಳಿಸಲಾಗಿದೆ."}</script></body></html>
